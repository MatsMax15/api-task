<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<!-- Styles -->
		<link rel="stylesheet" href="css/style.css" />

		<!-- js -->
		<script defer src="./main.js"></script>

		<title>Api Task - Prueba Técnica</title>
	</head>
	<body>
		<h1>Prueba Técnica</h1>
		<form id="signupForm" class="form-auth">
			<div class="form-header">
				<h1>Registro</h1>
			</div>

			<div class="form-body">
				<div class="form-group">
					<label for="name">Nombre</label>
					<input
						type="text"
						id="name"
						name="name"
						placeholder="Nombre"
						required
					/>
				</div>

				<div class="form-group">
					<label for="email">Email</label>
					<input
						type="email"
						id="email"
						name="email"
						placeholder="Email"
						required
					/>
				</div>

				<div class="form-group relative">
					<label for="password">Contraseña</label>
					<input
						type="password"
						id="password"
						name="password"
						class="password"
						placeholder="Contraseña"
						required
					/>
					<button type="button" class="btn icon" onclick="togglePass(this)">
						<span>show</span>
					</button>
				</div>
			</div>

			<div class="form-footer">
				<div class="form-group">
					<button
						type="button"
						class="btn btn-primary p-2"
						onclick="register()"
					>
						Registrarse
					</button>

					<div class="divider">
						<span></span>
						<span></span>
					</div>

					<a href="./login.html" class="btn btn-default text-sm p-2">
						¿Ya tienes una cuenta?
					</a>
				</div>
			</div>
		</form>

		<script>
			const register = async (event) => {
				const $email = document.getElementById('email').value
				const $password = document.getElementById('password').value
				const $name = document.getElementById('name').value

				const resp = await fetch('http://localhost:3000/api/v1/auth/signup', {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json',
					},
					body: JSON.stringify({
						email: $email,
						password: $password,
						name: $name,
					}),
				})

				const data = await resp.json()

				if (!data.success) {
					console.error(data)

					return toast({
						title: data.status_text,
						message: data.message,
						type: 'error',
					})
				}

				localStorage.setItem('user', JSON.stringify(data.data.user))

				toast({
					message: data.message,
					type: 'success',
				})

				setTimeout(() => {
					window.location.href = './tasks.html'
				}, 3000)
			}
		</script>
	</body>
</html>
