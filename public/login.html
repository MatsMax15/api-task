<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<!-- Styles -->
		<link rel="stylesheet" href="css/style.css" />

		<!-- js -->
		<script defer src="./main.js"></script>

		<title>Api Task - Prueba Técnica</title>
	</head>
	<body>
		<h1>Prueba Técnica</h1>
		<form id="loginForm">
			<div class="form-group">
				<div>
					<label for="email">Email:</label>
					<input
						type="email"
						id="email"
						name="email"
						required
						value="lmax@mail.com"
					/>
				</div>
				<div>
					<label for="password">Password:</label>
					<input
						type="password"
						id="password"
						name="password"
						required
						value="123456"
					/>
				</div>
				<a href="./signup.html" class="text-sm">Crear cuenta</a>
			</div>

			<button type="button" onclick="login(this)">Ingresar</button>
		</form>

		<script>
			const login = async (e) => {
				const $email = document.getElementById('email').value
				const $password = document.getElementById('password').value

				const resp = await fetch('http://localhost:3000/api/v1/auth/login', {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json',
					},
					body: JSON.stringify({
						email: $email,
						password: $password,
					}),
				})

				const data = await resp.json()

				if (!data.success) {
					console.error(data)

					return toast({
						title: data.status_text,
						message: data.message,
						type: 'error',
					})
				}

				localStorage.setItem('user', JSON.stringify(data.data.user))

				toast({
					message: data.message,
					type: 'success',
				})

				setTimeout(() => {
					window.location.href = './tareas.html'
				}, 3000)
			}
		</script>
	</body>
</html>
