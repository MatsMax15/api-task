<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="css/style.css" />

		<!-- js -->
		<script defer src="./main.js"></script>

		<script
			type="module"
			src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
		></script>
		<script
			nomodule
			src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
		></script>

		<title>Actualizar Tarea</title>
	</head>
	<body>
		<div class="container">
			<nav class="navbar">
				<div class="user-info"></div>

				<button
					class="btn p-2 flex justify-center item-center gap-1"
					onclick="logout()"
				>
					<span class="ion-xl">
						<ion-icon name="log-out-outline"></ion-icon>
					</span>
					<span class="text-sm">Salir</span>
				</button>
			</nav>

			<section>
				<h1>Actualizar Tarea</h1>
			</section>

			<section class="content">
				<div class="content-body">
					<form action="" class="form bg-transparented">
						<div class="form-group w-50">
							<label for="title">Título</label>
							<input
								type="text"
								class="input"
								id="title"
								placeholder="Título de la tarea"
							/>
						</div>

						<div class="form-group w-50">
							<label for="category">Categoría</label>
							<select name="category" id="category" class="input">
								<option value="">Selecciona una categoría</option>
							</select>
						</div>

						<div class="form-group w-50">
							<label for="title"> Fecha de entrega </label>
							<input type="date" class="input" id="dateLimit" />
						</div>

						<div class="form-group w-50">
							<label for="status">Estado</label>
							<select name="status" id="status" class="input">
								<option value="pending">Pendiente</option>
								<option value="completed">Completada</option>
							</select>
						</div>

						<div class="form-group w-full">
							<label for="description">Descripción</label>
							<textarea
								class="input"
								id="description"
								placeholder="Descripción de la tarea"
								rows="6"
							></textarea>
						</div>

						<div class="form-group w-full">
							<label for="file">Archivo</label>
							<input type="file" class="input" id="file" name="file" />
						</div>

						<div class="form-group w-full" id="container-file">
							<label for="file-preview">Archivo adjunto</label>
							<div id="file-preview" class="file-preview relative"></div>
						</div>
					</form>
				</div>

				<div class="content-footer">
					<a href="./tasks.html" class="btn btn-default border p-2">Volver</a>
					<button class="btn btn-primary p-2" onclick="updateTask()">
						Guardar cambios
					</button>
				</div>
			</section>
		</div>

		<script>
			document.addEventListener('DOMContentLoaded', async () => {
				ShowUserInfo()

				chargeTask()
			})
		</script>
	</body>
</html>
