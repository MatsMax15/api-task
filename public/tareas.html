<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="css/style.css" />

		<!-- js -->
		<script defer src="./main.js"></script>

		<title>Listado de Tareas</title>
	</head>
	<body>
		<div class="container">
			<nav class="navbar">
				<div class="user-info">
					<p class="user-email">Mats</p>
					<p class="user-name">Luis</p>
				</div>

				<div class="actions">
					<button class="btn p-2" onclick="Logout()">Cerrar Sesión</button>
				</div>
			</nav>

			<section>
				<h1>Listado de Tareas</h1>
			</section>

			<section class="content">
				<div class="content-header">
					<div class="search">
						<label for="search"> Buscar tarea </label>
						<input
							type="text"
							class="input"
							id="search"
							placeholder="Buscar tarea"
						/>
						<button>Buscar</button>
					</div>
					<div class="filter">
						<label for="status"> Filtrar por estado </label>
						<select name="" id="status">
							<option value="all">Todas</option>
							<option value="completed">Completadas</option>
							<option value="pending">Pendientes</option>
						</select>
					</div>
					<a href="./addTask.html" class="btn btn-primary p-2 text-sm"
						>Crear Tarea</a
					>
				</div>

				<div class="content-body">
					<table>
						<thead>
							<tr>
								<th>Titulo</th>
								<th>Descripción</th>
								<th>Categoría</th>
								<th>File</th>
								<th>Estado</th>
								<th>-</th>
							</tr>
						</thead>
						<tbody id="tasks" class="tasks"></tbody>
					</table>
				</div>

				<div class="content-footer">
					<div>
						<p class="text-sm">
							<span>Mostrando 1-10 de 100</span>
						</p>
					</div>
				</div>
			</section>
		</div>

		<script>
			document.addEventListener('DOMContentLoaded', async () => {
				ShowUserInfo()

				const responseAccess = await GetAccessToken()

				if (!responseAccess.success) {
					return toast({
						title: responseAccess.status_text,
						message: responseAccess.message,
						type: 'error',
					})
				}

				const { accessToken } = responseAccess.data

				const responseTasks = await GetTasks({ accessToken })

				if (!responseTasks.success) {
					return toast({
						title: responseTasks.status_text,
						message: responseTasks.message,
						type: 'error',
					})
				}

				ShowTasks({ tasks: responseTasks.data })
			})
		</script>
	</body>
</html>
